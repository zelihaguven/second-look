<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Second Look</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="eyebrow">Before you trust it</p>
      <h1>Second Look</h1>
    </header>

    <main>
      <section id="empty-state" class="empty" aria-labelledby="empty-heading">
        <h2 id="empty-heading">Nothing selected yet</h2>
        <p>
          Select an AI answer on any page, right-click, and choose
          <strong>Second Look</strong>.
        </p>
      </section>

      <section id="selection-view" aria-labelledby="selection-heading" hidden>
        <h2 id="selection-heading">Selected text</h2>
        <blockquote id="selection-text" class="selection"></blockquote>
        <p id="selection-meta" class="meta"></p>

        <button id="quick-check-button" class="primary" type="button">
          Run quick check
        </button>
        <p id="check-progress" class="meta" role="status" hidden></p>
        <p id="check-error" class="error" role="alert" hidden></p>
      </section>

      <section id="result-view" aria-labelledby="result-heading" hidden>
        <div class="result-head">
          <h2 id="result-heading">Quick check</h2>
          <span id="engine-badge" class="badge"></span>
        </div>
        <p id="result-notice" class="notice" hidden></p>
        <p id="result-summary" class="summary"></p>
        <ol id="claim-list" class="claims"></ol>
        <pre id="raw-output" class="raw" hidden></pre>
      </section>
    </main>

    <footer>
      <p id="firebase-status" class="status" role="status" data-state="pending">
        Checking Firebase…
      </p>
    </footer>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
